# 실측 값 (docs/decisions/0006). 설계 값(params/)은 그대로 두고, 재서 얻은 값을 여기에 적는다.
# 출력할 때마다 똑같이 생기는 차이(공차, 서보 실측 치수)는 부품 형상을 보정하는 데 쓰고,
# 관절 축 위치나 링크 길이 같은 기구학 값은 바꾸지 않는다.
# 스크립트가 값을 쓸 때는 tomlkit으로 써서 주석과 순서를 지킨다.
# 읽는 코드: packages/design/src/horilab_design/values.py

# 서보 무게 [g]. 저울로 잰다 (제작 로드맵 0단계). 재기 전에는 params/servos.toml의 명목값을 쓴다.
# 몸통은 혼을 뺀 무게다. 혼은 관절의 자식 쪽에 따로 넣는다 (studies/packaging.py).
# 하나씩 잰 값 (2026-11-11, 0.01 g 저울, 케이블은 빼고 출력 혼은 단 채): STS3215 ID 1 59.04, ID 4 59.03,
# ID 5 59.2, ID 6 59.31, ID 11 59.25, ID 20 59.35 (평균 59.2) / STS3250 ID 3 78.35. 뒷면 혼은 처음부터 없었다.
# 몸통 = 잰 값 - 출력 혼(나사 포함 2.0). STS3250의 출력 혼은 STS3215와 같은 혼으로 보았다.
[servo_mass_g]
STS3215 = 57.2
STS3250 = 76.4
# ST-3120 =

# 혼 두 개(출력 혼과 뒷면 혼) [g]. 출력 혼 하나 가운데 나사 포함 2.0 (STS3215에서 뺌),
# 따로 가진 뒷면 혼 하나 0.87 (나사 빼고) (2026-11-11). 재기 전에는 packaging.py의 어림(STS 8, ST-3120 25)을 쓴다.
[servo_horn_mass_g]
STS3215 = 2.9
STS3250 = 2.9
# ST-3120 =

# 출력물 무게 [g] (2026-11-11, 0.01 g 저울, 흰색 PLA Basic). 키는 STL 파일 이름이다. 출력 설정은 관절 시험대
# 3D 페이지의 카드대로다 (서보 모형만 채움 100%, 가운데 고리는 0.20mm Standard, 나머지는 0.20mm Strength).
# 어림(parts/joint_test.py의 estimated_mass_g)보다 가볍다: Strength 부품은 어림의 0.62~0.79배,
# 채움 100%인 서보 모형은 0.91배, Standard인 가운데 고리는 0.87배.
[printed_mass_g]
test_stand = 123.84
test_link = 76.38
servo_dummy = 44.44
gauge_bracket = 36.68
elbow_house = 29.86
elbow_disc_back = 13.0
elbow_disc_out = 12.53
elbow_ring = 11.31

# 서보 몸통 실측 [mm] (디지털 캘리퍼스, 2026-11-08). 출력 혼은 단 채로, 뒷면 혼은 빼고 쟀다.
# - far_thickness: 라벨 쪽 끝 두께. 앞면과 뒷면의 볼록한 판을 물었다
# - horn_to_back: 출력 혼 윗면 ~ 출력축 둘레의 낮은 뒷면(두께 29인 면). 축에서 라벨 쪽으로 약 7 mm, 혼 나사와
#   뒷면 보스를 피한 자리다. 어느 단까지인지는 깊이 막대로 잰 값으로 정했다 (docs/hardware.md의 "혼 높이")
# 뒷면 커넥터에 선을 꽂고 잰 값 (2026-11-12). 선을 라벨 쪽으로 눕히고, 한쪽 턱은 출력 혼 윗면에,
# 다른 턱은 꽂은 선에 대고 살짝 눌렀다.
# - horn_to_wire: 출력 혼 윗면 ~ 꽂아 눕힌 선. STS3250은 턱이 선에 닿았다 (선이 낮은 뒷면에서 5.62,
#   커넥터가 있는 두께 32인 뒷면에서 4.12)
# - horn_to_boss: 출력 혼 윗면 ~ 뒷면 보스 끝. STS3215는 턱이 선보다 먼저 보스에 닿았다 (보스가 낮은 뒷면에서
#   4.11). 선은 그보다 낮다
[servo_body]
STS3215 = { far_thickness_mm = 35.01, horn_to_back_mm = 33.21, horn_to_boss_mm = 37.32 }
STS3250 = { far_thickness_mm = 35.01, horn_to_back_mm = 33.38, horn_to_wire_mm = 39.00 }

# 깊이 막대로 잰 값 [mm] (디지털 캘리퍼스, 2026-11-13). 캘리퍼스를 수평으로 세우기 어려워 값이 오르내려서
# (작은 값, 큰 값)으로 적는다
# - horn_above_label: 출력 혼 윗면 ~ 앞면 라벨 판(스티커 면)의 단차. horn_to_back을 낮은 뒷면까지로 읽은 값
#   (STS3215 1.61, STS3250 1.78)과 맞는다
# - horn_screw_head: 혼 가운데 나사 머리가 혼 윗면 위로 나온 높이. 머리 자리는 큰 값으로 잡는다
[servo_depth]
horn_above_label_mm = [1.5, 1.75]
horn_screw_head_mm = [1.7, 2.0]
horn_screw_head_diameter_mm = 5.15

# 서보 선(딸려 온 20 cm 선) [mm] (디지털 캘리퍼스, 2026-11-13): 세 가닥을 나란히 놓은 폭과 두께
[servo_wire]
width_mm = 4.75
thickness_mm = 1.5

# D405 기본 선(USB 3 Micro-B, 1 m)의 지름 [mm] (디지털 캘리퍼스, 2026-11-13). 무게와 플러그는 아직 재지 않았다
[d405_cable]
diameter_mm = 5.12

# D405에 쓸 얇은 USB 2 마이크로 USB 선 [mm] (docs/decisions/0031-wiring.md의 D405 선). 길이는 플러그 끝에서 끝까지
# (2026-11-14). 굵기, 무게, 플러그 치수는 아직 재지 않았다
[d405_usb2_cable]
length_mm = 1550

# 서보 선 플러그(5264 3핀) 몸통 [mm] (디지털 캘리퍼스, 2026-11-12). 구멍으로 지나가려면 9.6 × 5.4 넘는 틈이 필요하다
[servo_plug]
length_mm = 9.58 # 꽂는 방향
width_mm = 9.01
thickness_mm = 4.75

# 공차 시험편으로 고른 설계 치수 [mm]. 필라멘트마다 적는다 (docs/manufacturing.md의 "공차").
# 1차 시험편(M3 볼트 구멍, 너트 홈): uv run python -m horilab_design.coupons
# 출력 설정은 docs/manufacturing.md의 "출력 설정"이다.
[fit.pla_basic_white]
# 1차 시험편 결과 (2026-11-07, M3 × 10 렌치볼트와 M3 육각너트로 끼워 봄)
m3_hole_mm = 3.1 # 세로 구멍: M3 볼트가 걸리지 않고 지나가는 가장 작은 지름. 시험한 가장 작은 칸도 손으로 지나갔다
m3_hole_horizontal_mm = 3.3 # 가로 구멍(둥근 구멍)의 지름. 3.2는 중간에 걸려 돌려야 지나갔다
m3_tap_hole_mm = 2.8 # M3 볼트를 플라스틱에 바로 조여 넣는 구멍. 2.7은 힘이 많이 든다
m3_nut_pocket_mm = 5.6 # 위에서 눌러 끼우는 육각 홈의 맞변 거리. 손으로 눌러 들어가고 뒤집어도 안 떨어진다 (5.5는 너무 뻑뻑, 5.7은 떨어짐)
m3_nut_slot_width_mm = 5.6 # 너트가 누워 옆에서 밀려 들어가는 홈의 폭. 가운데에서 멈추고 조여도 안 돈다 (5.7도 되지만 조금 논다)
m3_nut_slot_height_mm = 2.8 # 그 홈의 높이 (폭 시험에 쓴 기본 높이)
# 너트가 서는 홈은 잰 값이 없다. 받침 기둥 귀(너트가 서서 옆에서 밀려 들어가고 홈 천장이 허공에 걸침)를
# 위 5.6 × 2.8로 뽑았더니 너트가 손으로 들어가지 않아 드라이버로 밀어 넣었다 (2026-11-11).
# 시험 링크 뿌리(너트가 서서 윗면에서 내려감)도 같은 값이다. 검정은 fit1_nut_slots_upright와 fit1_nut_drops로 잰다
# 2차 시험편 결과 (2026-11-08): 서보 몸체 자리와 혼 자리의 여유 (도면 치수에 더하는 값)
# - 몸체 틀: STS3215는 +0.1이 힘을 줘야 들어가고 +0.2가 힘 없이 맞는다. STS3250은 +0.1이 들어가지 않고,
#   +0.2는 조금 뻑뻑하며, +0.3이 힘 없이 들어간다. 틀을 몸통을 따라 밀면 구간마다 빡빡한 정도가 조금 다르다
# - 혼 자리: 두 서보 모두 +0.1은 힘을 줘야 덮이고 +0.2가 힘 없이 덮인다. M3 구멍 넷이 혼의 구멍과 맞는다
# - ST-3120은 서보가 오면 넣어 본다
seat_clearance_mm = { STS3215 = 0.2, STS3250 = 0.3 }
horn_clearance_mm = { STS3215 = 0.2, STS3250 = 0.2 }
# 3차 시험편: 영점 핀(MSH3-20), 6806 자리와 축 (설계 지름). 핀은 쓰는 색마다, 6806은 베이스 색(검정)으로 잰다
# 핀 구멍은 핀이 손으로 부드럽게 들어가고 빠지며, 꽂은 채 흔들어도 놀지 않는 가장 작은 지름이다. 뻑뻑한 칸은 고르지 않는다
# 세로 구멍 (2026-11-10). 첫 판(3.00~3.25)에는 핀이 한 칸도 들어가지 않았고, 새 판에서 3.30은 뻑뻑해 잘 안 들어가고
# 3.35는 조금 논다. 뻑뻑한 칸은 고르지 않으므로 3.35이고, 영점을 읽을 때 틈을 한쪽에 붙인다 (docs/decisions/0024)
pin_hole_mm = 3.35
pin_hole_horizontal_mm = 3.30 # 가로 구멍(둥근 구멍) (2026-11-10). 3.25는 끝까지 들어가지만 뻑뻑하다
# bearing_6806_bore_mm =    # 바깥 링을 손으로 밀어 넣을 수 있고 놀지 않는 구멍
# bearing_6806_shaft_mm =   # 안쪽 링을 손으로 끼울 수 있고 놀지 않는 축
# 큰 세로 구멍 (2026-11-10): 받침 기둥 위끝 고리(설계 34.8)를 갈라진 틈을 피해 두 방향으로 쟀다 (34.50, 34.45). 작은 값
tube_bore_mm = 34.45

[fit.pla_basic_black] # 항목은 흰색과 같고, 너트가 서는 홈(m3_nut_upright_*, m3_nut_drop_*)을 더 잰다
