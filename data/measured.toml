# 공차 시험편으로 고른 설계 치수 [mm]. 필라멘트마다 적는다 (docs/manufacturing.md의 "공차").
# 1차 시험편(M3 볼트 구멍, 너트 홈): uv run python -m horilab_design.coupons
# 출력 설정은 docs/manufacturing.md의 "출력 설정"이다.
[fit.pla_basic_white]
# 1차 시험편 결과 (2026-11-07, M3 × 10 렌치볼트와 M3 육각너트로 끼워 봄)
m3_hole_mm = 3.1 # 세로 구멍: M3 볼트가 걸리지 않고 지나가는 가장 작은 지름. 시험한 가장 작은 칸도 손으로 지나갔다
m3_hole_horizontal_mm = 3.3 # 가로 구멍(물방울 모양)의 원 지름. 3.2는 중간에 걸려 돌려야 지나갔다
m3_tap_hole_mm = 2.8 # M3 볼트를 플라스틱에 바로 조여 넣는 구멍. 2.7은 힘이 많이 든다
m3_nut_pocket_mm = 5.6 # 위에서 눌러 끼우는 육각 홈의 맞변 거리. 손으로 눌러 들어가고 뒤집어도 안 떨어진다 (5.5는 너무 뻑뻑, 5.7은 떨어짐)
m3_nut_slot_width_mm = 5.6 # 옆에서 밀어 넣는 홈의 폭. 가운데에서 멈추고 조여도 안 돈다 (5.7도 되지만 조금 논다)
m3_nut_slot_height_mm = 2.8 # 옆에서 밀어 넣는 홈의 높이 (폭 시험에 쓴 기본 높이)
# 2차 시험편: 서보 몸체 자리와 혼 자리의 여유 (도면 치수에 더하는 값)
