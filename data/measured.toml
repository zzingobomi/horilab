# 실측 값 (docs/decisions/0006). 설계 값(params/)은 그대로 두고, 재서 얻은 값을 여기에 적는다.
# 출력할 때마다 똑같이 생기는 차이(공차, 서보 실측 치수)는 부품 형상을 보정하는 데 쓰고,
# 관절 축 위치나 링크 길이 같은 기구학 값은 바꾸지 않는다.
# 스크립트가 값을 쓸 때는 tomlkit으로 써서 주석과 순서를 지킨다.
# 읽는 코드: packages/design/src/horilab_design/values.py

# 서보 무게. 저울로 잰다 (제작 로드맵 0단계). 재기 전에는 params/servos.toml의 명목값을 쓴다.
