# 구매 데이터 (docs/decisions/0004, 0006). 사람이 보는 부품표 docs/bom.md는 이 파일에서 만든다:
#   uv run python -m horilab_design.bom
#
# 아직 손에 없는 것만 둔다. 주문하면 ordered(와 arrive)를 넣고, 받으면 지우고 docs/hardware.md의 "가진 것"에 넣는다.
#
# when: 언제 사나 (주문한 품목은 쓰지 않는다)
#   now        지금 주문한다. since는 지금 사기로 한 날
#   stage      stage 단계 전에 산다. 그 앞 단계를 하는 동안 주문한다
#   pick       살 것은 정했고 규격이나 제품을 고르는 중이다. 고르면 now로 옮긴다
#   if_needed  조건이 생기면 산다. 아직 살지 모른다
# stage: 처음 필요한 제작 로드맵 단계 (docs/status.md)
# vendor, url: 사는 곳과 링크. 모르면 비우고, search에 찾을 때 쓸 검색어(모델 번호나 규격)를 둔다
# 값은 부가세를 넣은 값이고, 확인한 때(priced)의 값이다. 모르면 비워 둔다 (합계에서 빠지고 표에 "모름"으로 나온다)
# lead_days는 주문해서 받기까지다 (준비 기간 + 택배)

