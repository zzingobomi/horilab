# 로봇 설정 (docs/decisions/0024-servo-bus.md). 컨트롤러가 읽는 설정은 이 파일뿐이다 (0009).
# 로봇마다 다른 값(서보 ID, 영점, 방향)과 컨트롤러의 기준값을 둔다. 설계 값(params/)은 옮기지 않는다.
# 각도는 도이고 키 이름에 단위를 붙인다. 컨트롤러 안에서는 rad다. 모르는 키가 있으면 읽을 때 실패한다.
# 읽는 코드: crates/controller/src/settings.rs. 설계와 맞는지(서보 모델, 소프트 한계가 설계 범위 안인지)는
# tests/test_robot_settings.py가 본다. 고친 뒤 확인: cargo run -p horilab-controller -- settings
# 관절은 조립하는 대로 더한다. 지금은 관절 하나 시험의 J3만 있다 (0021).

# 서보 값의 0/4095 경계를 소프트 한계에서 떨어뜨릴 각도 [°]. 위치 모드가 경계를 넘어 움직이는지는 실물로
# 확인하기 전이라(0024), 경계는 관절을 손으로 밀어도 가지 못하는 자리에 둔다. 부품이 닿기 전까지 설계 범위
# 밖으로 가장 많이 도는 관절이 J4의 38°라서(0017의 관절 범위) 45°로 둔다. 팔 부품을 그리면 다시 본다.
boundary_clearance_deg = 45

[joints.j3]
id = 3 # 서보 ID는 관절 번호다 (0024)
model = "STS3250"
soft_limits_deg = [-30, 118] # 컨트롤러가 움직이는 범위. 설계 범위(params/arm.toml) 안이다
# 영점과 방향은 관절 시험의 영점 단계에서 재서 적는다 (0024 만드는 순서 5). 재기 전에는 이 관절을 움직이지 않는다.
# 영점이 경계 조건에 맞지 않으면 컨트롤러가 영점이 들어야 할 범위를 알려 준다.
# zero_raw =  # 영점 핀을 꽂은 자리의 서보 값 (0~4095, 위치 오프셋 0에서 읽는다, 0024의 영점)
# direction = # 관절 각이 늘 때 서보 값이 늘면 1, 줄면 -1
