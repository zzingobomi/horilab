[project]
name = "horilab"
version = "0.1.0"
description = "3D 프린터로 출력한 부품과 Feetech 서보로 만드는 6축 로봇팔 (PC 워크스페이스 루트)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "horilab-camera",
    "horilab-design",
    "horilab-servo",
]

[tool.uv]
package = false
# uv 캐시(C:)와 레포(D:)가 다른 드라이브면 하드링크가 안 돼서 경고가 난다. 처음부터 복사로 둔다.
link-mode = "copy"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
horilab-design = { workspace = true }
horilab-servo = { workspace = true }
horilab-camera = { workspace = true }

[dependency-groups]
dev = [
    "cargo-zigbuild>=0.24.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8",
    "ruff>=0.17.4",
    "yourdfpy>=0.0.60",
]

# 도구 설정. 고른 이유는 docs/decisions/0010-code-test-git-rules.md

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 기본 규칙(E4, E7, E9, F)에 스타일, import 정렬, 흔한 버그, 최신 문법 규칙을 더한다.
select = ["E", "F", "W", "I", "B", "UP", "RUF", "TID251"]
# E501: 코드 줄 길이는 포맷터가 맞춘다. 한국어 주석은 글자 폭이 2로 세어져 길이 검사에서 뺀다.
# RUF001~003: 문서에서 쓰는 ×(곱하기) 같은 기호를 헷갈리는 문자로 잡는 규칙이라 뺀다.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

# 서보에 직접 닿는 모듈은 servo 패키지에서만 부른다. 편집기에서 바로 보이게 하려는 것이고,
# 경계 규칙 전체는 tests/test_structure.py가 본다 (docs/decisions/0007-repo-structure.md).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"horilab_servo".msg = "서보에 직접 명령하는 코드는 servo 패키지에만 둔다. 컨트롤러 클라이언트를 쓴다 (0007)"
"serial".msg = "서보 포트는 servo 패키지만 연다 (0007)"
"scservo_sdk".msg = "서보 SDK는 servo 패키지만 쓴다 (0007)"

[tool.ruff.lint.per-file-ignores]
"packages/servo/**" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["horilab_design", "horilab_servo", "horilab_camera"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["packages", "tests", "tools", "conftest.py"]
# 서보에 직접 명령하는 코드는 더 엄격하게 본다.
strict = ["packages/servo"]
# camera는 파이에서 Python 3.11로 돌 수 있다 (0007).
executionEnvironments = [
    { root = "packages/camera", pythonVersion = "3.11" },
    { root = "." },
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
python_files = ["test_*.py"]  # 소스의 joint_test.py 같은 이름을 테스트로 읽지 않는다
addopts = ["--import-mode=importlib"]
pythonpath = ["."]  # 테스트가 tools/의 스크립트를 불러온다
markers = [
    "slow: CAD 생성처럼 느린 테스트",
    "hardware: 실물 서보·카메라를 쓰는 테스트. --hardware를 줘야 돈다",
]
