[project]
name = "horilab-control"
version = "0.1.0"
description = "상위 제어: IK, 궤적, 시뮬레이션 백엔드, 작업 코드"
requires-python = ">=3.12,<3.15"
dependencies = [
    "eaik>=1.2,<2",
    "horilab-motor",
    "mink>=1.4,<2",
    "mujoco>=3.17,<4",
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
horilab-motor = { workspace = true }
