[project]
name = "horilab-design"
version = "0.1.0"
description = "치수 값에서 부품, 조립, 출력 파일, URDF, MJCF, 부품표를 만들고 검사한다"
requires-python = ">=3.12,<3.15"
dependencies = [
    "bd-warehouse>=0.4,<0.5",
    "build123d>=0.13,<0.14",
    "eaik>=1.2,<2",
    "mujoco>=3.17,<4",
    "numpy>=2.5.4",
    "ocp-vscode>=4.2,<4.3",
    "pydantic>=2,<3",
    "tomlkit>=0.13",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
