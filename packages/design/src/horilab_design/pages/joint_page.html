<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 짜임: 위에 조립 단계 버튼, 가운데 3D 화면과 조작 줄, 아래에 그 단계 글과 숫자 표.
   제목, 단계, 부품의 구실, 숫자 표, 글은 모두 데이터(pages/joint_page.py)에서 온다 */
:root {
  --bg: #f2f4f7; --panel: #ffffff; --ink: #18212b; --muted: #5a6877; --line: #d3dae2;
  --accent: #1f5fd0; --accent-ink: #ffffff; --mark: #d9480f; --stage: #e6eaef; --edge: #6f7a87;
  --sans: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151a; --panel: #1a2028; --ink: #e7ecf2; --muted: #9ba8b6; --line: #2c3540;
    --accent: #7fb0ff; --accent-ink: #0d1524; --mark: #ff9057; --stage: #2a323c; --edge: #8a94a1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151a; --panel: #1a2028; --ink: #e7ecf2; --muted: #9ba8b6; --line: #2c3540;
  --accent: #7fb0ff; --accent-ink: #0d1524; --mark: #ff9057; --stage: #2a323c; --edge: #8a94a1;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 22px 44px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
h2 { margin: 0 0 8px; font-size: 17px; font-weight: 600; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
button { font: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.steps { display: grid; grid-template-columns: repeat(var(--cols, 9), minmax(0, 1fr)); gap: 6px; }
.step { display: grid; justify-items: center; gap: 1px; padding: 7px 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); cursor: pointer; min-width: 0; }
.step .n { font: 600 18px/1.1 var(--mono); color: var(--muted); }
.step .t { font-size: 12px; font-weight: 500; line-height: 1.3; text-align: center; }
.step[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step[aria-pressed="true"] .n { color: var(--accent-ink); }

.stage { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--stage); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.hint { position: absolute; right: 12px; top: 10px; margin: 0; font-size: 12px; color: var(--muted); }
.axis { position: absolute; left: 12px; top: 10px; margin: 0; font-size: 12px; color: var(--muted); }
.nogl { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); }

.ctl { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.ctl label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.ctl input[type=range] { width: min(240px, 46vw); accent-color: var(--accent); }
.ctl input[type=checkbox] { accent-color: var(--accent); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.panel p { margin: 0; max-width: 72ch; }
.panel p + p { margin-top: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 13px; }
td.num { text-align: right; font-family: var(--mono); font-size: 13.5px; white-space: nowrap; }
tr.pick { cursor: pointer; }
tr.pick:hover td { color: var(--accent); }
tr.on td { color: var(--mark); font-weight: 600; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; border: 1px solid var(--line); vertical-align: 0; }
ul.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; max-width: 72ch; }
.foot { margin: 0; color: var(--muted); font-size: 13px; max-width: 72ch; }
.tablewrap { overflow-x: auto; }

@media (max-width: 640px) {
  .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stage { aspect-ratio: 4 / 5; }
  .hint { display: none; }
}
</style>

<div class="wrap">
  <header>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
  </header>

  <nav class="steps" id="steps" aria-label="조립 단계"></nav>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="관절 부품을 보여 주는 3D 그림"></canvas>
    <p class="axis">위가 출력 쪽(자식), 아래가 뒷덮개</p>
    <p class="hint">끌면 돌아가고, 휠로 확대됩니다</p>
    <p class="nogl" id="nogl" hidden>3D 그림을 띄우지 못했습니다. 아래 글과 표를 봐 주세요.</p>
  </div>

  <div class="ctl">
    <label><span id="slideName">펼치기</span><input type="range" id="slide" min="0" max="100" value="0"></label>
    <label><span>관절 돌리기 <b id="angText">0°</b></span><input type="range" id="ang" min="-163" max="163" value="0"></label>
    <label><input type="checkbox" id="cut" checked>집을 반으로 잘라 속 보기</label>
    <label><input type="checkbox" id="cutAll">속 부품도 자르기</label>
    <button type="button" id="reset" class="step" style="padding:5px 12px"><span class="t">처음 시점</span></button>
  </div>

  <section class="panel" aria-live="polite">
    <h2 id="stepTitle"></h2>
    <p id="stepText"></p>
  </section>

  <div class="grid">
    <section class="panel">
      <h2>부품 (누르면 그림에서 표시)</h2>
      <div class="tablewrap"><table id="parts"><thead><tr><th>부품</th><th>색</th><th style="text-align:right">무게</th></tr></thead><tbody></tbody></table></div>
      <p class="foot" style="margin-top:8px" id="massNote"></p>
    </section>
    <section class="panel">
      <h2>크기와 틈</h2>
      <div class="tablewrap"><table id="dims"><tbody></tbody></table></div>
    </section>
  </div>

  <section class="panel">
    <h2>이 구조로 잡은 까닭</h2>
    <ul class="plain" id="why"></ul>
  </section>

  <section class="panel">
    <h2>아직 남은 것</h2>
    <ul class="plain" id="todo"></ul>
  </section>
</div>

<script type="application/json" id="mesh-data">__MESH_JSON__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const DATA = JSON.parse($('mesh-data').textContent);
  const META = DATA.meta;

  const PAGE = DATA.page;
  // 부품마다: 조립 단계(step), 끼우는 방향으로 흩어지는 거리(dy, mm. 벽 나사는 반지름 쪽 rad).
  // 이름이 같거나(pre가 참이면 그 이름으로 시작하면) 그 구실이다. 앞에 적힌 것이 먼저다
  function role(name) {
    for (let k = 0; k < PAGE.roles.length; k += 1) {
      const r = PAGE.roles[k];
      if (name === r.n || (r.pre && name.indexOf(r.n) === 0)) return r;
    }
    return { step: 0, dy: 0 };
  }
  const STEP_TEXT = PAGE.steps.map((s) => [s.title, s.text]);
  document.title = PAGE.title;
  $('h1').textContent = PAGE.h1;
  $('sub').textContent = PAGE.sub;
  $('massNote').textContent = PAGE.mass_note;
  [['why', PAGE.why], ['todo', PAGE.todo]].forEach((pair) => {
    pair[1].forEach((line) => { const li = document.createElement('li'); li.textContent = line; $(pair[0]).appendChild(li); });
  });
  const nav = $('steps');
  nav.style.setProperty('--cols', String(Math.min(PAGE.steps.length, window.matchMedia && window.matchMedia('(max-width: 640px)').matches ? 3 : PAGE.steps.length)));
  PAGE.steps.forEach((s, k) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'step'; b.setAttribute('aria-pressed', k === 0 ? 'true' : 'false');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = String(k);
    const tx = document.createElement('span'); tx.className = 't'; tx.textContent = s.t;
    b.appendChild(n); b.appendChild(tx); nav.appendChild(b);
  });
  $('ang').min = String(-META.stop); $('ang').max = String(META.stop);
  const COLORS = { body: 0xf1f1ee, cap: 0x2b2e33, frame: 0x3a4250, metal: 0xb7bec7, servo: 0x30343a, plug: 0xf3efe4, wire: 0xd03a2c, wire2: 0xd03a2c, pin: 0xe0a030 };
  const COLOR_NAME = { body: '흰색 PLA', cap: '검정 PLA', frame: '검정 PLA', metal: '금속', servo: '서보', plug: '플러그', wire: '선 자리', wire2: '서보 선', pin: '강철 핀' };

  // ----- 표 -----
  const groups = new Map();
  DATA.parts.forEach((p) => {
    const key = p.n.replace(/ \d+$/, '');
    const g = groups.get(key) || { name: key, color: p.c, mass: 0, count: 0 };
    g.mass += p.g; g.count += 1;
    groups.set(key, g);
  });
  const tbody = document.querySelector('#parts tbody');
  let picked = null;
  groups.forEach((g) => {
    if (g.name === '선 자리' || g.name === '서보 선') return;
    const tr = document.createElement('tr');
    tr.className = 'pick';
    const hex = '#' + (COLORS[g.color] || 0x888888).toString(16).padStart(6, '0');
    tr.innerHTML = '<td><span class="chip" style="background:' + hex + '"></span>' + g.name + (g.count > 1 ? ' × ' + g.count : '') + '</td><td>' + (COLOR_NAME[g.color] || '') + '</td><td class="num">' + (g.mass > 0 ? g.mass.toFixed(1) + ' g' : '') + '</td>';
    tr.addEventListener('click', () => {
      picked = picked === g.name ? null : g.name;
      tbody.querySelectorAll('tr').forEach((r) => r.classList.remove('on'));
      if (picked) tr.classList.add('on');
      if (window.__pick) window.__pick(picked);
    });
    tbody.appendChild(tr);
  });
  const dims = PAGE.dims;
  const dbody = document.querySelector('#dims tbody');
  dims.forEach((d) => { const tr = document.createElement('tr'); tr.innerHTML = '<td>' + d[0] + '</td><td class="num">' + d[1] + '</td>'; dbody.appendChild(tr); });

  const stepBtns = Array.from(document.querySelectorAll('.steps .step'));
  let cur = 0;
  let on3d = null;
  function setStep(i) {
    cur = i;
    stepBtns.forEach((b, k) => b.setAttribute('aria-pressed', k === cur ? 'true' : 'false'));
    $('stepTitle').textContent = STEP_TEXT[cur][0];
    $('stepText').textContent = STEP_TEXT[cur][1];
    $('slideName').textContent = cur === 0 ? '펼치기' : '끼우기';
    $('slide').value = 0;
    if (on3d) on3d();
  }
  stepBtns.forEach((b, k) => b.addEventListener('click', () => setStep(k)));

  function init3d() {
    const T = window.THREE;
    if (!T || !T.OrbitControls) throw new Error('three.js를 불러오지 못했다');
    const stage = $('stage'), canvas = $('c');
    const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.localClippingEnabled = true;
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(30, 1.6, 5, 5000);
    const controls = new T.OrbitControls(camera, canvas);
    controls.enableDamping = true; controls.dampingFactor = 0.12;
    controls.minDistance = 40; controls.maxDistance = 1500;
    scene.add(new T.HemisphereLight(0xffffff, 0x8a94a3, 0.8));
    const sun = new T.DirectionalLight(0xffffff, 0.55); sun.position.set(-160, 260, 320); scene.add(sun);
    const fill = new T.DirectionalLight(0xffffff, 0.2); fill.position.set(220, -120, -240); scene.add(fill);

    const clip = new T.Plane(new T.Vector3(0, 0, -1), 0.01);
    const edgeMat = new T.LineBasicMaterial({ color: 0x6f7a87 });
    const edgeMatClip = new T.LineBasicMaterial({ color: 0x6f7a87, clippingPlanes: [clip] });
    const stageColor = new T.Color();
    function applyTheme() {
      stageColor.set(cssVar('--stage') || '#e6eaef');
      edgeMat.color.set(cssVar('--edge') || '#6f7a87'); edgeMatClip.color.copy(edgeMat.color);
    }
    applyTheme();
    if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyTheme); }
    new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    const items = DATA.parts.map((p) => {
      const geo = new T.BufferGeometry();
      geo.setAttribute('position', new T.BufferAttribute(new Float32Array(p.v), 3));
      geo.setIndex(p.i);
      geo.computeVertexNormals();
      const mat = new T.MeshStandardMaterial({
        color: COLORS[p.c] || 0x888888, roughness: p.c === 'metal' ? 0.4 : 0.7, metalness: p.c === 'metal' ? 0.35 : 0.0,
        side: T.DoubleSide, transparent: p.c === 'wire', opacity: p.c === 'wire' ? 0.45 : 1
      });
      const mesh = new T.Mesh(geo, mat);
      const edges = new T.LineSegments(new T.EdgesGeometry(geo, 28), edgeMat);
      mesh.add(edges);
      scene.add(mesh);
      return { p: p, mesh: mesh, edges: edges, mat: mat, role: role(p.n), key: p.n.replace(/ \d+$/, ''), base: mat.color.clone() };
    });

    const STEP_SCALE = 0.5;
    const spin = new T.Group(); scene.add(spin);
    items.forEach((it) => { if (it.p.m) { scene.remove(it.mesh); spin.add(it.mesh); } });
    let lo = 0, hi = 0;
    function update(keepView) {
      const k = Number($('slide').value) / 100;
      lo = 0; hi = 0;
      const cut = $('cut').checked, cutAll = $('cutAll').checked;
      items.forEach((it) => {
        const r = it.role;
        let f;      // 0 = 제자리, 1 = 다 흩어진 자리
        let show = true;
        if (cur === 0) { f = k; }
        else {
          if (r.step > cur) show = false;
          f = r.step === cur ? (1 - k) * STEP_SCALE : 0;
          if (r.step === 0) f = 0;
        }
        if (r.hideUntil && cur !== 0 && cur < r.hideUntil) show = false;
        if (r.zeroOnly && Number($('ang').value) !== 0) show = false;
        if (r.pinOnly && Number($('ang').value) !== PAGE.pin_pose) show = false;
        it.mesh.visible = show;
        let x = 0, y = r.dy * f, z = 0;
        if (r.rad) {
          x = r.rad[0] * 16 * f; z = r.rad[2] * 16 * f;
          if (cur === 0) y = 0;
        }
        it.mesh.position.set(x, y, z);
        if (show) { lo = Math.min(lo, y); hi = Math.max(hi, y); }
        const isShell = !!r.shell;
        const clipped = (cut && isShell) || (cutAll && it.p.c !== 'metal' && it.p.n.indexOf('벽 나사') !== 0);
        it.mat.clippingPlanes = clipped ? [clip] : [];
        it.edges.material = clipped ? edgeMatClip : edgeMat;
        const hot = (cur !== 0 && r.step === cur) || (picked && it.key === picked);
        it.mat.emissive.setHex(hot ? (picked && it.key === picked ? 0x7a2a00 : 0x0f2f66) : 0x000000);
        it.mat.needsUpdate = true;
      });
      const q = Number($('ang').value);
      spin.rotation.y = -q * Math.PI / 180;
      $('angText').textContent = (q > 0 ? '+' : '') + q + '°';
      if (keepView !== true) reframe();
    }
    let pickedName = null;
    Object.defineProperty(window, '__pick', { value: (name) => { pickedName = name; update(true); }, configurable: true });
    on3d = () => update();
    $('slide').addEventListener('input', () => update());
    $('ang').addEventListener('input', () => update(true));
    $('cut').addEventListener('change', () => update(true));
    $('cutAll').addEventListener('change', () => update(true));

    const DIR0 = new T.Vector3(150, 80, 250).normalize();
    const dir = DIR0.clone();
    function reframe() {
      // 보이는 부품이 다 들어오게 거리와 보는 곳만 맞춘다 (보는 방향은 그대로)
      const yLo = PAGE.frame.y0 + lo, yHi = PAGE.frame.y1 + hi;
      const h = (yHi - yLo) * 1.18 + 14;
      const w = PAGE.frame.w * 1.18;
      const t = Math.tan(15 * Math.PI / 180);
      const d = Math.max(h / (2 * t), w / (2 * t * camera.aspect));
      dir.copy(camera.position).sub(controls.target);
      if (dir.lengthSq() < 1) dir.copy(DIR0); else dir.normalize();
      controls.target.set(PAGE.frame.cx, (yLo + yHi) / 2, 0);
      camera.position.copy(controls.target).addScaledVector(dir, d);
    }
    function goView() {
      camera.position.copy(controls.target).add(DIR0);
      reframe();
    }
    $('reset').addEventListener('click', goView);

    function syncSize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      if (w > 1 && h > 1) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
    }
    if (window.ResizeObserver) new ResizeObserver(syncSize).observe(stage);
    window.addEventListener('resize', syncSize);
    syncSize();
    camera.position.copy(DIR0).multiplyScalar(300);
    update();
    (function frame() {
      requestAnimationFrame(frame);
      controls.update();
      renderer.setClearColor(stageColor, 1);
      renderer.render(scene, camera);
    })();
  }

  try { init3d(); } catch (err) { $('nogl').hidden = false; if (window.console) console.error(err); }
  const m = /^#step-(\d+)$/.exec(location.hash || '');
  setStep(m && Number(m[1]) < STEP_TEXT.length ? Number(m[1]) : 0);
  if (/^#open/.test(location.hash || '')) { $('slide').value = 100; if (on3d) on3d(); }
  const ma = /^#ang(-?\d+)$/.exec(location.hash || '');
  if (ma) { $('ang').value = ma[1]; if (on3d) on3d(); }
  if (/^#in-(d)/.test(location.hash || '')) { setStep(Number(location.hash.slice(4, 5))); $('slide').value = 100; if (on3d) on3d(); }
})();
</script>
