[project]
name = "horilab-servo"
version = "0.1.0"
description = "서보 버스의 Python 기준 구현과 첫 연결 명령. Rust 버스(crates/servo)와 결과를 맞춰 보는 데 쓴다"
# 첫 연결 때 여분 파이(hori3)에서도 통신 시간을 재므로 가벼운 의존성만 쓴다.
requires-python = ">=3.12,<3.15"
dependencies = [
    "ftservo-python-sdk>=2.0.1,<3",
    "pyserial>=3.5",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
