[project]
name = "horilab-motor"
version = "0.1.0"
description = "모터 프로세스와 이야기하는 Python 쪽 (메시지), 서보 버스 기준 구현"
requires-python = ">=3.12,<3.15"
dependencies = [
    "ftservo-python-sdk>=2.0.1,<3",
    "pydantic>=2,<3",
    "pyserial>=3.5",
    "pyzmq>=26",
    "tomlkit>=0.13",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
